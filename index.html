<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Website</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #141e30, #243b55);
            color: white;
            text-align: center;
            padding: 50px 15px;
        }

        .container {
            background: white;
            color: #222;
            padding: 30px;
            border-radius: 15px;
            max-width: 500px;
            margin: auto;
        }

        button {
            background: #007bff;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>Welcome to My Website!</h1>

    <p>Hello! Welcome to my first personal website.</p>

    <h2>About Me</h2>
    <p>I am learning technology, programming and web development.</p>

    <h2>My Goals</h2>
    <p>To become a successful website developer.</p>

    <button onclick="alert('Welcome to my website!')">
        Click Me
    </button>
</div>

</body>
